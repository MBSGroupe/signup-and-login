# CI
#   checks  every push and pull request: lint (no new errors:
#           scripts/lint-ratchet.cjs), unit tests with their coverage floors
#           (vite.config.js), build
#   e2e     browser tests (Playwright) against the backend on a synthetic
#           database — nightly, on pull requests to main, and on demand.
#           Needs the secret BACKEND_REPO_TOKEN (read access to the private
#           backend repo); the backend branch is the variable BACKEND_REF
#           (default main).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # 03:00 in Algiers
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (no new errors)
        run: npm run lint:ratchet
      - name: Unit tests and coverage floors
        run: npm run test:cov -- --coverage.reporter=text-summary
      - name: Build
        run: npm run build

  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_TEMPLATE_DB: erp_synthetic
      E2E_DATA: synthetic
      E2E_BACKEND_DIR: backend
      E2E_ENV_FILE: .env.none
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Backend access
        env:
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret BACKEND_REPO_TOKEN missing: a token with read access to MBSGroupe/gest-org-backend"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MBSGroupe/gest-org-backend
          ref: ${{ vars.BACKEND_REF || 'main' }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Synthetic database
        run: npm run e2e:seed
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      # Synthetic data only here: the report can be kept.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7
